name: Build NovixGram APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Keep one debug signing key across workflow runs so APK updates install over the previous version.
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: novixgram-debug-keystore-v1

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Print debug signing fingerprints
        run: gradle signingReport

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovixGram-debug
          path: app/build/outputs/apk/debug/app-debug.apk
