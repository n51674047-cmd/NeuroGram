name: Build NovixGram APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: novixgram-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Gradle actually stores the debug key in this XDG Android user directory on GitHub runners.
      # Keep this exact file cached so every future APK is signed with the same certificate.
      - name: Restore persistent debug signing key
        id: signing_key
        uses: actions/cache@v4
        with:
          path: /home/runner/.config/.android/debug.keystore
          key: neurogram-debug-signing-key-v1

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Verify persistent signing key exists
        run: test -s /home/runner/.config/.android/debug.keystore

      - name: Print debug signing fingerprints
        run: gradle signingReport

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovixGram-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Read app version
        id: app_version
        run: VERSION=$(grep versionName app/build.gradle.kts | cut -d '"' -f2); echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: NovixGram ${{ steps.app_version.outputs.version }}
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
